name: Build and package TCMALLOC_PROFILER plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: tcmalloc-profiler
      plugin_directory: tcmalloc_profiler
      build_target: tcmalloc_profiler
      plugin_library: tcmalloc_profiler.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: tcmalloc_profiler
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
